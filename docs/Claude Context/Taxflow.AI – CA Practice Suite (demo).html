<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taxflow.AI – CA Practice Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',Consolas,'Cascadia Mono',monospace;
  --bg:#060A13;--bg2:#0A1120;--panel:#0C1425;--card:#111B31;--card2:#162341;--line:#1E2C4A;--line2:#2B3D63;
  --tx:#E8EEFB;--tx2:#A6B4D3;--tx3:#6F7FA3;
  --blue:#4C8DFF;--blue2:#2F6BFF;--cyan:#3DD6F5;--green:#34D399;--amber:#F6C453;--red:#F87171;--violet:#8B7CFF;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --paper:#F4F6FA;--ink:#1B2437;
}
:root[data-theme="light"]{
  --bg:#EDF1F9;--bg2:#E4EAF6;--panel:#FFFFFF;--card:#FFFFFF;--card2:#F1F5FC;--line:#DAE2F1;--line2:#C3CFE6;
  --tx:#0E1A33;--tx2:#43537A;--tx3:#7484A8;
  --blue:#2563EB;--blue2:#1D4ED8;--cyan:#0891B2;--green:#059669;--amber:#B7791F;--red:#DC2626;--violet:#6D5BEA;
  --shadow:0 10px 30px rgba(20,40,90,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:13.5px/1.5 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{flex:none;display:block}

/* ---------- window frame ---------- */
.app{height:100vh;display:grid;grid-template-rows:40px minmax(0,1fr) 26px}
.titlebar{display:grid;grid-template-columns:auto minmax(180px,440px) 1fr auto;align-items:center;gap:16px;background:var(--bg2);border-bottom:1px solid var(--line);padding-left:12px;user-select:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:700}
.logo{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--blue2),var(--cyan));display:grid;place-items:center;color:#031028}
.brand small{font-weight:500;color:var(--tx3);font-size:12px}
.gsearch{position:relative}
.gsearch input{width:100%;height:28px;border-radius:8px;background:var(--panel);border:1px solid var(--line);padding:0 10px 0 30px;font-size:12.5px}
.gsearch .gi{position:absolute;left:9px;top:7px;color:var(--tx3)}
.gres{position:absolute;top:34px;left:0;right:0;background:var(--card);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);z-index:80;max-height:340px;overflow:auto;padding:6px}
.gres button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:8px}
.gres button:hover{background:var(--card2)}
.gres small{color:var(--tx3);display:block;font-size:11.5px}
.wc{display:flex;height:40px}
.wc button{width:44px;background:none;border:0;color:var(--tx2);display:grid;place-items:center}
.wc button:hover{background:var(--card2);color:var(--tx)}
.wc .x:hover{background:#C42B1C;color:#fff}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr) 380px;min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;overflow:auto}
.main{overflow:auto;padding:24px 28px 40px;background:var(--bg)}
.chat{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.statusbar{display:flex;align-items:center;gap:18px;padding:0 14px;background:var(--bg2);border-top:1px solid var(--line);font-size:11.5px;color:var(--tx3)}
.statusbar b{color:var(--tx2);font-weight:500}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent)}
body.chat-hidden .shell{grid-template-columns:232px minmax(0,1fr) 0}
body.chat-hidden .chat{display:none}

/* ---------- sidebar ---------- */
.gtitle{font-size:11.5px;color:var(--tx3);padding:14px 10px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:10px;background:none;border:0;color:var(--tx2);text-align:left;font-weight:500;position:relative}
.nav:hover{background:var(--card);color:var(--tx)}
.nav.on{background:linear-gradient(90deg,color-mix(in srgb,var(--blue) 22%,transparent),color-mix(in srgb,var(--blue) 6%,transparent));color:var(--tx)}
.nav.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--blue)}
.nav.on .ic{color:var(--blue)}
.nav .bd{margin-left:auto;font-size:11px;min-width:20px;text-align:center;padding:1px 6px;border-radius:99px;background:var(--card2);color:var(--tx2);font-weight:600}
.nav .bd.hot{background:color-mix(in srgb,var(--red) 20%,transparent);color:var(--red)}
.nav.pulse{animation:pulse 1.1s ease 1}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--blue) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.vault{margin-top:auto;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:12px}
.vault b{display:block;font-size:12.5px;margin-bottom:2px}
.vault span{color:var(--tx3)}
.me{display:flex;gap:10px;align-items:center;padding:12px 6px 0}
.me small{color:var(--tx3);display:block;font-size:11.5px}

/* ---------- shared UI ---------- */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:700;letter-spacing:-.2px}
.ph p{color:var(--tx3);margin-top:3px;max-width:62ch}
.ph-a{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.card-h h2{font-size:14px;font-weight:600}
.card-h small{color:var(--tx3)}
.card-b{padding:14px 16px 16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{padding:14px 16px;border-radius:14px}
.kpi span{color:var(--tx3);font-size:12px}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.5px;margin:2px 0}
.kpi em{font-style:normal;font-size:12px;color:var(--tx2)}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:9px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:linear-gradient(180deg,var(--blue),var(--blue2));border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{height:27px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.gh{background:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--card2);color:var(--tx2);white-space:nowrap}
.chip.blue{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.chip.cyan{background:color-mix(in srgb,var(--cyan) 16%,transparent);color:var(--cyan)}
.chip.green{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.chip.amber{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.chip.red{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.chip.violet{background:color-mix(in srgb,var(--violet) 18%,transparent);color:var(--violet)}
.pill-btn{border:1px solid var(--line);background:var(--card);color:var(--tx2);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600}
.pill-btn.on{background:color-mix(in srgb,var(--blue) 18%,transparent);border-color:var(--blue);color:var(--blue)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;padding:9px 14px;color:var(--tx3);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--tx);border-color:var(--blue)}
.inp,.sel{height:34px;width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:0 10px}
textarea.inp{height:auto;padding:9px 10px;resize:vertical;line-height:1.5}
.inp:focus,.sel:focus{border-color:var(--blue);outline:none}
label.f{display:block;font-size:12px;color:var(--tx3);font-weight:600;margin:0 0 5px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue2),var(--cyan))}
.bar.ok>i{background:var(--green)}.bar.warn>i{background:var(--amber)}.bar.bad>i{background:var(--red)}
.av{width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--t) 22%,transparent);color:var(--t);display:grid;place-items:center;font-weight:700;font-size:11.5px;flex:none}
.av.lg{width:40px;height:40px;border-radius:13px;font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mut{color:var(--tx3)}.mut2{color:var(--tx2)}
.mono{font-family:var(--mono);font-size:12px}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;color:var(--tx3);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--card2)}tr.sel td{background:color-mix(in srgb,var(--blue) 10%,transparent)}
tr:last-child td{border-bottom:0}
.tg{width:38px;height:22px;border-radius:99px;background:var(--line2);border:0;position:relative;transition:.15s;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.tg.on{background:var(--blue)}.tg.on::after{left:19px}
.empty{padding:36px 16px;text-align:center;color:var(--tx3)}
.empty b{display:block;color:var(--tx2);margin-bottom:4px}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--amber) 10%,transparent);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);color:var(--tx2);font-size:12.5px}
.note .ic{color:var(--amber);margin-top:2px}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid color-mix(in srgb,var(--blue) 30%,transparent);border-top-color:var(--blue);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.enter{animation:fade .18s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
#toasts{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none}
.toast{background:var(--card2);border:1px solid var(--line2);box-shadow:var(--shadow);padding:9px 14px;border-radius:10px;font-weight:500;display:flex;gap:8px;align-items:center}
.toast .ic{color:var(--green)}
.modal{position:fixed;inset:0;background:rgba(3,8,20,.62);display:grid;place-items:center;z-index:120;padding:20px}
.modal[hidden]{display:none}
.mbox{width:min(520px,100%);background:var(--card);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);padding:20px;max-height:92vh;overflow:auto}
.mbox h2{font-size:17px;margin-bottom:14px}
.mrow{margin-bottom:12px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- dashboard ---------- */
.list-i{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list-i:last-child{border-bottom:0}
.list-i:hover .li-t{color:var(--blue)}
.li-t{font-weight:600}
.pipe{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin:10px 0}
.pipe i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2)}
.legend b{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px}
.feed{display:flex;gap:11px;padding:8px 0}
.feed .fi{width:26px;height:26px;border-radius:8px;background:var(--card2);color:var(--blue);display:grid;place-items:center;flex:none}
.ask{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* ---------- extraction ---------- */
.xgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
.paper{background:var(--paper);color:var(--ink);border-radius:10px;padding:18px 18px 16px;font-size:11.5px;line-height:1.45;box-shadow:0 8px 22px rgba(0,0,0,.28);min-height:390px}
.paper.hand{font-family:'Caveat','Segoe Print',cursive;font-size:15px;transform:rotate(-.6deg)}
.paper .ph2{display:flex;justify-content:space-between;gap:8px;border-bottom:2px solid #1B2437;padding-bottom:8px;margin-bottom:8px}
.paper .tt{text-align:center;font-weight:700;letter-spacing:1px;margin:6px 0 8px}
.paper .meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.paper table{margin:8px 0}
.paper th{background:#E4E9F2;color:#1B2437;position:static;padding:5px 6px;font-size:10.5px;border-bottom:1px solid #C7D0E0}
.paper td{padding:5px 6px;border-bottom:1px dashed #CBD3E1}
.paper .tot{text-align:right}
.paper mark{background:none;color:inherit;border-bottom:1.5px dashed #2F6BFF;padding:0 1px}
.paper.on-x mark{background:rgba(76,141,255,.16)}
.paper mark.on{background:#FDE68A;border-bottom-color:#B45309;outline:2px solid #F59E0B;border-radius:2px}
.paper.raw mark{border-bottom-color:transparent}
.fld{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.fld:last-of-type{border-bottom:0}
.fld small{color:var(--tx3);font-weight:600}
.conf{display:flex;align-items:center;gap:8px;margin-top:4px}
.conf .bar{flex:1;height:4px}
.conf span{font-size:11px;color:var(--tx3);min-width:34px;text-align:right}
.calc{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:10px 12px;background:var(--panel);border-radius:10px;margin:12px 0}
.calc b{text-align:right}

/* ---------- whatsapp ---------- */
.wa-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px}
.wa{display:grid;grid-template-columns:250px minmax(0,1fr);height:clamp(520px,calc(100vh - 330px),740px);overflow:hidden}
.wa-l{border-right:1px solid var(--line);overflow:auto}
.wa-c{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.wa-c:hover{background:var(--card2)}
.wa-c.on{background:color-mix(in srgb,var(--blue) 12%,transparent)}
.wa-c.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.wa-c .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-c .pv{color:var(--tx3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.wa-c .tm{font-size:11px;color:var(--tx3)}
.wa-r{display:flex;flex-direction:column;min-width:0;min-height:0}
.wa-h{padding:11px 16px;border-bottom:1px solid var(--line)}
.ckl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#wa-thread{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 60%,var(--panel)),var(--panel))}
.dsep{align-self:center;font-size:11.5px;color:var(--tx3);background:var(--card);border:1px solid var(--line);padding:2px 12px;border-radius:99px;margin:6px 0}
.msg{max-width:76%;padding:8px 12px 6px;border-radius:14px;position:relative;word-wrap:break-word}
.msg.cl{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:linear-gradient(180deg,var(--blue),var(--blue2));color:#fff;border-bottom-right-radius:4px}
.msg .mt{display:block;font-size:10.5px;opacity:.72;text-align:right;margin-top:2px}
.msg.sched{background:transparent;border:1.5px dashed var(--blue);color:var(--tx);max-width:82%}
.msg.sched .sh{display:flex;gap:6px;align-items:center;color:var(--blue);font-weight:600;font-size:11.5px;margin-bottom:4px;flex-wrap:wrap}
.msg.sched .sa{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.sys{align-self:center;font-size:11.5px;color:var(--tx2);background:color-mix(in srgb,var(--cyan) 10%,transparent);border:1px solid color-mix(in srgb,var(--cyan) 26%,transparent);padding:4px 12px;border-radius:99px;display:flex;gap:6px;align-items:center}
.att{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:9px;background:rgba(0,0,0,.18);margin-bottom:3px}
.wa-f{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.wa-f .sel{width:150px;flex:none}
.tline{position:relative;padding-left:22px}
.tline::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-day{font-weight:700;margin:18px 0 8px;position:relative}
.tl-day::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 22%,transparent)}
.rem{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;margin-bottom:8px}
.rem .rt{font-weight:700;font-size:15px}
.rem .rt small{display:block;font-weight:500;color:var(--tx3);font-size:11.5px}
.rem p{color:var(--tx2);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tpl{padding:16px}
.tpl p{margin:8px 0 12px;color:var(--tx2);background:var(--panel);padding:10px 12px;border-radius:10px;font-size:12.5px}

/* ---------- files ---------- */
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.tree{max-height:calc(100vh - 300px);min-height:420px;overflow:auto;padding:6px 8px 10px}
.tr{display:flex;align-items:center;gap:8px;padding:5px 8px 5px calc(8px + var(--l)*20px);border-radius:8px;cursor:pointer;color:var(--tx2)}
.tr:hover{background:var(--card2)}
.tr.sel{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--tx)}
.caret{width:14px;color:var(--tx3);transition:.12s;display:grid;place-items:center}
.caret.o{transform:rotate(90deg)}
.tr .tl2{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .cnt{font-size:11px;color:var(--tx3)}
.tr.file .tl2{font-family:var(--mono);font-size:12px}
.fold-raw{color:var(--amber)}.fold-ext{color:var(--cyan)}.fold-gen{color:var(--violet)}.fold-c{color:var(--blue)}.fold-y{color:var(--tx3)}
.ext-pdf{color:var(--red)}.ext-jpg{color:var(--violet)}.ext-xlsx,.ext-csv{color:var(--green)}.ext-json,.ext-xml{color:var(--cyan)}
.pathbar{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;word-break:break-all;color:var(--tx2)}
pre.code{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font:12px/1.55 var(--mono);color:var(--tx2);overflow:auto;max-height:340px;white-space:pre}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;margin:12px 0;font-size:12.5px}
.kv span{color:var(--tx3)}

/* ---------- deadlines ---------- */
.dcl{margin-bottom:10px;overflow:hidden}
.dcl-h{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(140px,1.4fr) auto 20px;gap:16px;align-items:center;padding:13px 16px;cursor:pointer}
.dcl-h:hover{background:var(--card2)}
.dcl-h .pc{font-weight:700;font-size:13px}
.dcl-b{border-top:1px solid var(--line);padding:4px 16px 12px;background:var(--panel)}
.task{padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task-r{display:grid;grid-template-columns:minmax(120px,1.3fr) 150px minmax(110px,1fr) auto;gap:14px;align-items:center}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.stp{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:3px 9px 3px 6px;font-size:12px;color:var(--tx2)}
.stp:hover{border-color:var(--blue)}
.stp .bx{width:15px;height:15px;border-radius:5px;border:1.5px solid var(--line2);display:grid;place-items:center;color:transparent}
.stp.d{color:var(--tx3)}.stp.d .bx{background:var(--green);border-color:var(--green);color:#03150f}
.stp.d span{text-decoration:line-through;text-decoration-color:var(--tx3)}

/* ---------- generator ---------- */
.ggrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.gt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gtype{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border-radius:11px;border:1px solid var(--line2);background:var(--panel);text-align:left}
.gtype:hover{border-color:var(--blue)}
.gtype.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.gtype b{display:block;font-size:12.5px}
.gtype small{color:var(--tx3);font-size:11.5px;line-height:1.35;display:block}
.gtype .bx{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line2);display:grid;place-items:center;color:transparent;margin-top:1px;flex:none}
.gtype.on .bx{background:var(--blue);border-color:var(--blue);color:#fff}
.out{padding:12px 0;border-bottom:1px solid var(--line)}
.out:last-child{border-bottom:0}

/* ---------- clients/billing/settings ---------- */
.ccard{padding:16px}
.ccard .kvs{display:grid;grid-template-columns:70px 1fr;gap:4px 8px;margin:12px 0;font-size:12.5px}
.ccard .kvs span{color:var(--tx3)}
.chart{display:flex;align-items:flex-end;gap:14px;height:170px;padding:10px 6px 0}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .st{width:100%;max-width:46px;display:flex;flex-direction:column;justify-content:flex-end;height:130px;border-radius:8px;overflow:hidden;gap:2px}
.chart .st i{display:block}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow div.tx{flex:1}
.setrow b{display:block}
.setrow small{color:var(--tx3)}

/* ---------- chat assistant ---------- */
.ch-h{display:flex;gap:11px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ch-h .logo{width:32px;height:32px;border-radius:11px}
.ch-h small{color:var(--tx3);display:block;font-size:11.5px}
#ai-msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.cm{max-width:92%;padding:10px 13px;border-radius:14px;line-height:1.55}
.cm.me{align-self:flex-end;background:linear-gradient(180deg,var(--blue),var(--blue2));color:#fff;border-bottom-right-radius:4px}
.cm.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.cm ul{margin:6px 0 2px;padding-left:18px}
.cm li{margin:2px 0}
.cm .opened{display:inline-flex;align-items:center;gap:6px;margin-top:9px;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);border:0;border-radius:8px;padding:4px 10px;font-weight:600;font-size:12px}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--tx3);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.sugg{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto;flex-wrap:nowrap}
.sugg button{flex:none;background:var(--card);border:1px solid var(--line2);color:var(--tx2);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:500}
.sugg button:hover{border-color:var(--blue);color:var(--tx)}
.ch-f{display:flex;gap:8px;padding:12px}
.ch-f input{flex:1;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line2);padding:0 12px}
.ch-f input:focus{outline:none;border-color:var(--blue)}
.ch-f .btn{height:38px;width:42px;justify-content:center;padding:0}

/* ---------- responsive ---------- */
@media (max-width:1280px){
  .shell{grid-template-columns:210px minmax(0,1fr)}
  .chat{position:fixed;right:0;top:40px;bottom:26px;width:min(400px,100%);transform:translateX(102%);transition:transform .2s;z-index:70;box-shadow:var(--shadow)}
  body.chat-open .chat{transform:none}
  body.chat-hidden .shell{grid-template-columns:210px minmax(0,1fr)}
  body.chat-hidden .chat{display:flex}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.ggrid,.fgrid,.xgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .shell{grid-template-columns:62px minmax(0,1fr)}
  .side .nav span.lb,.gtitle,.vault,.me div,.nav .bd{display:none}
  .nav{justify-content:center}
  .main{padding:18px 14px 36px}
  .titlebar{grid-template-columns:auto 1fr auto}.titlebar>div:nth-child(3){display:none}
  .brand small{display:none}
  .g3,.g2e,.g4{grid-template-columns:minmax(0,1fr)}
  .wa{grid-template-columns:78px minmax(0,1fr)}.wa-c .pv,.wa-c .nm,.wa-c .tm{display:none}.wa-c{justify-content:center;padding:10px 6px}
  .dcl-h{grid-template-columns:1fr auto 20px}.dcl-h>div:nth-child(2){display:none}
  .task-r{grid-template-columns:1fr auto}
  .statusbar span:nth-child(n+3){display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const FLD=[['date','Invoice date'],['no','Invoice number'],['party','Party name'],['gstin','GSTIN / Tax ID'],['taxable','Taxable value'],['rate','Tax rate %']];
function paperHTML(d){
  const c=cl(d.client),k=calc(d),ext=d.status!=='queued',dt=d.hand?d.date.getDate()+'/'+(d.date.getMonth()+1)+'/'+String(d.date.getFullYear()).slice(2):fdmy(d.date);
  const names=d.kind==='Sales'?['Trading goods (assorted)','Packing & freight']:d.kind==='Purchase'?['Raw material / stock','Handling charges']:['Services rendered','Service charge'];
  const a=Math.round(d.taxable*0.6/10)*10,b=d.taxable-a,m=(f,t)=>'<mark data-hl="'+f+'">'+esc(t)+'</mark>';
  const taxRows=Object.keys(k.split).map(x=>'<div>'+x+' @ '+(x==='CGST'||x==='SGST'?d.rate/2:d.rate)+'%: '+num(k.split[x])+'</div>').join('');
  return '<div class="paper '+(d.hand?'hand ':'')+(ext?'on-x':'raw')+'">'
   +'<div class="ph2"><b>'+esc(d.party)+'</b><span>'+(c.cur==='INR'?'GSTIN':'Tax ID')+': '+m('gstin',d.gstin)+'</span></div>'
   +'<div class="tt">TAX INVOICE</div><div class="meta"><span>Invoice No: '+m('no',d.no)+'</span><span>Date: '+m('date',dt)+'</span></div>'
   +'<div>Bill to: <b>'+esc(c.name)+'</b>, '+esc(c.city)+'</div>'
   +'<table><tr><th>Description</th><th class="tot">Qty</th><th class="tot">Amount</th></tr><tr><td>'+names[0]+'</td><td class="tot">1</td><td class="tot">'+num(a)+'</td></tr><tr><td>'+names[1]+'</td><td class="tot">1</td><td class="tot">'+num(b)+'</td></tr></table>'
   +'<div class="tot">Taxable value: '+m('taxable',num(d.taxable))+'</div><div class="tot">'+taxRows+'</div><div class="tot">Rate: '+m('rate',d.rate+'%')+'</div>'
   +'<div class="tot" style="margin-top:6px;font-weight:700;border-top:2px solid #1B2437;padding-top:5px">Total: '+num(k.total)+'</div>'
   +'<div style="margin-top:12px;font-size:10px;opacity:.6">'+(d.hand?'Handwritten bill photographed on WhatsApp':'Scanned copy · '+esc(d.src))+'</div></div>'}
function fieldsHTML(d){
  const ext=d.status!=='queued',k=calc(d),c=cl(d.client);
  if(!ext)return '<div class="empty"><b>Not extracted yet</b>Run extraction to read the date, invoice number, party, tax ID and amounts from this bill.<div style="margin-top:14px">'+(d.running?'<span class="chip blue"><i class="spin"></i>Extracting</span>':btn(ic('bolt',14)+'Run extraction','ex-run','data-id="'+d.id+'"','pri'))+'</div></div>';
  const vals={date:iso(d.date),no:d.no,party:d.party,gstin:d.gstin,taxable:d.taxable,rate:d.rate};
  const rows=FLD.map(f=>{const cf=d.conf[f[0]],low=cf<0.8;
    return '<div class="fld" data-hlf="'+f[0]+'"><small>'+f[1]+'</small><div><input class="inp" data-bind="docf" data-id="'+d.id+'" data-f="'+f[0]+'" value="'+esc(vals[f[0]])+'"><div class="conf">'+bar(cf*100,low?'warn':'ok')+'<span style="color:'+(low?'var(--amber)':'var(--tx3)')+'">'+Math.round(cf*100)+'%</span></div></div></div>'}).join('');
  const bd=Object.keys(k.split).map(x=>'<span class="mut">'+x+'</span><b>'+money(k.split[x],c.cur)+'</b>').join('');
  return rows+'<div class="calc"><span class="mut">Taxable value</span><b>'+money(d.taxable,c.cur)+'</b>'+bd+'<span>Invoice total</span><b>'+money(k.total,c.cur)+'</b></div>'
   +'<div class="row">'+(d.status==='approved'?chip('Approved and saved to the Extracted folder','green'):btn(ic('check',14)+'Approve and save to folder','ex-approve','data-id="'+d.id+'"','pri'))+btn(ic('refresh',14)+'Re-run','ex-rerun','data-id="'+d.id+'"','gh')+'</div>'}
PAGES.extract=()=>{
  const u=S.ui.ex,st=d=>docStatus(d),f=u.filter,docs=S.docs.filter(d=>f==='all'||st(d)===f);
  const sel=S.docs.find(d=>d.id===u.sel)||S.docs[0];
  const cnt=k=>S.docs.filter(d=>d.status===k).length;
  const avg=Math.round(sum(S.docs.filter(d=>d.status!=='queued'),d=>Math.min.apply(null,Object.values(d.conf)))/Math.max(1,S.docs.filter(d=>d.status!=='queued').length)*100);
  const rows=docs.map(d=>{const c=cl(d.client),mc=Math.round(Math.min.apply(null,Object.values(d.conf))*100);
    return '<tr class="click '+(d.id===sel.id?'sel':'')+'" data-act="ex-sel" data-id="'+d.id+'"><td><div class="row">'+av(c)+'<span>'+esc(c.short)+'</span></div></td><td class="mono">'+esc(docBase(d))+'</td><td>'+chip(d.kind)+'</td><td><span class="row mut2" style="gap:6px">'+srcIc(d.src)+d.src+'</span></td><td>'+fDate(d.date)+'</td><td>'+money(calc(d).total,c.cur)+'</td><td>'+stChip(st(d))+'</td><td class="mut">'+(d.status==='queued'?'—':mc+'%')+'</td></tr>'}).join('');
  const filt=[['all','All'],['queued','Queued'],['review','Needs review'],['extracted','Extracted'],['approved','Approved']];
  return head('Invoice extraction','Bills and invoices arrive from WhatsApp, email and uploads. Dates, numbers, parties and amounts are read automatically, then checked by you.',btn(ic('bolt',14)+'Extract all queued','ex-runall','','')+btn(ic('upload',14)+'Add sample bill','ex-add','','pri'))
  +'<div class="grid g4"><div class="card kpi"><span>In queue</span><b>'+cnt('queued')+'</b><em>Waiting to be read</em></div><div class="card kpi"><span>Needs review</span><b style="color:var(--amber)">'+cnt('review')+'</b><em>Low-confidence fields</em></div><div class="card kpi"><span>Approved</span><b style="color:var(--green)">'+cnt('approved')+'</b><em>Saved to client folders</em></div><div class="card kpi"><span>Average confidence</span><b>'+avg+'%</b><em>Across extracted invoices</em></div></div>'
  +'<div class="card" style="margin-top:14px"><div class="card-h"><h2>Invoice queue</h2><div class="row" style="gap:6px;flex-wrap:wrap">'+filt.map(x=>'<button class="pill-btn '+(f===x[0]?'on':'')+'" data-act="ex-filter" data-f="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></div>'
  +'<div style="max-height:250px;overflow:auto;margin-top:10px"><table><thead><tr><th>Client</th><th>File</th><th>Type</th><th>Source</th><th>Invoice date</th><th>Total</th><th>Status</th><th>Confidence</th></tr></thead><tbody>'+(rows||'<tr><td colspan="8"><div class="empty"><b>Nothing here</b>No invoices match this filter.</div></td></tr>')+'</tbody></table></div></div>'
  +'<div class="xgrid"><div class="card"><div class="card-h"><h2>Original bill</h2><small>'+esc(cl(sel.client).name)+'</small></div><div class="card-b">'+paperHTML(sel)+'</div></div>'
  +'<div class="card"><div class="card-h"><h2>Extracted data</h2><small>Hover a field to find it on the bill</small></div><div class="card-b">'+fieldsHTML(sel)+'</div></div></div>'};

  const c=cl(S.ui.wa.client),th=(S.threads[c.id]||[]).slice().sort((a,b)=>a.at-b.at);let h='',last='';

    h+='<div class="msg '+m.f+'">'+(m.file?'<div class="att">'+ic('file',18)+'<div><div class="mono" style="font-size:11.5px">'+esc(m.file)+'</div><div style="font-size:10.5px;opacity:.75">Captured to client folder</div></div></div>':'')+(m.t?esc(m.t):'')+'<span class="mt">'+fTime(m.at)+(m.auto?' · automated':'')+tick+'</span></div>'});

const perLabel=p=>{const a=p.split('-');return MONTH[+a[1]-1]+' '+a[0]};
function recommended(c){return GEN.filter(g=>g.svc==='*'||c.svc.indexOf(g.svc)>=0||(g.id==='recon'&&c.svc.indexOf('GST')>=0)).map(g=>g.id)}
function genDocs(c,per){const p=per.split('-').map(Number),all=S.docs.filter(d=>d.client===c.id&&d.status!=='queued'),inp=all.filter(d=>d.date.getFullYear()===p[0]&&d.date.getMonth()===p[1]-1);return inp.length>=2?inp:all}
function genContent(t,c,per){
  const p=per.split('-').map(Number),m=p[1],y=p[0],ds=genDocs(c,per),sales=ds.filter(d=>d.kind==='Sales'),pur=ds.filter(d=>d.kind!=='Sales');
  const S1=(a,f)=>sum(a,x=>f(calc(x)));
  if(t.id==='gstr1'||t.id==='gstr3b'||t.id==='recon'||t.id==='tds'){if(c.cur!=='INR')return '// '+t.name+' applies to Indian GST and TDS registrations.\n// Choose VAT return workings for this client.'}
  if(t.id==='vat'&&c.cur==='INR')return '// VAT workings apply to UAE and UK clients.\n// Choose GSTR-3B for this client.';
  switch(t.id){
  case 'gstr1':{const g={};sales.forEach(d=>{(g[d.gstin]=g[d.gstin]||[]).push(d)});
    return JSON.stringify({gstin:c.gstin,fp:pad(m)+y,b2b:Object.keys(g).map(k=>({ctin:k,inv:g[k].map(d=>{const k2=calc(d);const det={txval:d.taxable,rt:d.rate};if(k2.split.IGST!=null)det.iamt=k2.split.IGST;else{det.camt=k2.split.CGST;det.samt=k2.split.SGST}return{inum:d.no,idt:fdmy(d.date),val:k2.total,pos:d.gstin.slice(0,2),inv_typ:'R',itms:[{num:1,itm_det:det}]}})}))},null,2)}
  case 'gstr3b':{const tx=sum(sales,d=>d.taxable),ig=S1(sales,k=>k.split.IGST||0),cg=S1(sales,k=>k.split.CGST||0),sg=S1(sales,k=>k.split.SGST||0),ii=S1(pur,k=>k.split.IGST||0),ic2=S1(pur,k=>k.split.CGST||0),is=S1(pur,k=>k.split.SGST||0);
    return JSON.stringify({gstin:c.gstin,ret_period:pad(m)+y,sup_details:{osup_det:{txval:tx,iamt:ig,camt:cg,samt:sg}},itc_elg:{itc_avl:[{ty:'OTH',iamt:ii,camt:ic2,samt:is}]},net_payable:{iamt:Math.max(0,ig-ii),camt:Math.max(0,cg-ic2),samt:Math.max(0,sg-is)}},null,2)}
  case 'recon':return 'Supplier\tGSTIN\tInvoice\tTaxable\tGST\tStatus\n'+(pur.map(d=>[d.party,d.gstin,d.no,d.taxable,calc(d).tax,d.status==='review'?'Mismatch – check with supplier':'Matched with 2B'].join('\t')).join('\n')||'No purchase invoices in this period');
  case 'itr':{const tv=sum(sales,d=>d.taxable),pv=sum(pur.filter(d=>d.kind==='Purchase'),d=>d.taxable),ex=sum(pur.filter(d=>d.kind==='Expense'),d=>d.taxable),gp=tv-pv;
    return 'Particulars\tAmount\nTurnover (sales)\t'+tv+'\nPurchases\t'+pv+'\nGross profit\t'+gp+'\nOther expenses\t'+ex+'\nNet profit before tax\t'+(gp-ex)+'\n\n// Tax slabs and deductions are applied when the return is prepared.'}
  case 'tds':return 'Deductee\tPAN\tSection\tAmount paid\tRate\tTDS\n'+(pur.map(d=>{const pan=d.gstin.slice(2,12),a=d.taxable;return [d.party,pan,'194C',a,'2%',Math.round(a*0.02)].join('\t')}).join('\n')||'No payments in this period');
  case 'vat':{const o=S1(sales,k=>k.tax),i=S1(pur,k=>k.tax);return 'VAT workings – '+c.name+' – '+perLabel(per)+'\nBox 1  Output VAT on sales\t'+money(o,c.cur)+'\nBox 4  Input VAT on purchases\t'+money(i,c.cur)+'\nNet VAT payable\t'+money(o-i,c.cur)+'\nSales invoices\t'+sales.length+'\nPurchase and expense invoices\t'+pur.length}
  case 'tally':return '<ENVELOPE>\n <BODY><IMPORTDATA><REQUESTDATA>\n'+ds.map(d=>'  <TALLYMESSAGE><VOUCHER VCHTYPE="'+(d.kind==='Sales'?'Sales':'Purchase')+'" ACTION="Create">\n   <DATE>'+iso(d.date).replace(/-/g,'')+'</DATE><VOUCHERNUMBER>'+esc(d.no)+'</VOUCHERNUMBER>\n   <PARTYLEDGERNAME>'+esc(d.party)+'</PARTYLEDGERNAME><AMOUNT>'+calc(d).total+'</AMOUNT>\n  </VOUCHER></TALLYMESSAGE>').join('\n')+'\n </REQUESTDATA></IMPORTDATA></BODY>\n</ENVELOPE>';
  case 'reg':return 'Date\tType\tInvoice\tParty\tTaxable\tTax\tTotal\n'+ds.map(d=>[fdmy(d.date),d.kind,d.no,d.party,d.taxable,calc(d).tax,calc(d).total].join('\t')).join('\n');
  default:return 'Client summary – '+c.name+' – '+perLabel(per)+'\n\nInvoices processed\t'+ds.length+'\nSales\t'+money(sum(sales,d=>d.taxable),c.cur)+'\nPurchases and expenses\t'+money(sum(pur,d=>d.taxable),c.cur)+'\nOpen items\t'+missing(c).length+' documents pending\nNext filing\t'+(nextTask(c)?nextTask(c).t.name+' on '+fDate(nextTask(c).due):'—')}
}

function startGen(){

  case 'ex-rerun':{const d=S.docs.find(x=>x.id===ds.id);d.status='queued';d.running=false;runExtract(d.id);break}
  case 'ex-approve':{const d=S.docs.find(x=>x.id===ds.id);d.status='approved';Object.keys(d.conf).forEach(k=>{if(d.conf[k]<0.8)d.conf[k]=1});syncDocFiles(d);logA('check','Approved '+d.no+' for '+cl(d.client).name+' and saved it to the Extracted folder');toast('Saved to '+cl(d.client).short+' / Extracted');touch();break}
  case 'ex-add':{const cid=S.clients[Math.floor(Math.random()*S.clients.length)].id,d=newDoc(cid);S.ui.ex.sel=d.id;S.ui.ex.filter='all';logA('upload','Added a sample bill for '+cl(cid).name);toast('Added a bill for '+cl(cid).short);if(S.page!=='extract')go('extract',0);else render(true);if(S.settings.autoExtract)setTimeout(()=>runExtract(d.id),600);break}
  /* whatsapp */
  case 'wa-client':S.ui.wa.client=ds.c;refreshWA();break;
  case 'wa-tab':S.ui.wa.tab=ds.t;render(true);break;
  case 'wa-send':sendMsg();break;
  case 'rem-new':openSchedule(ds.c?{client:ds.c}:{});break;
  case 'rem-tpl':openSchedule({tpl:ds.t});break;
  case 'rem-send':{const r=S.reminders.find(x=>x.id===ds.id);sendReminderNow(r);toast('Sent to '+cl(r.client).short);touch();break}
  case 'rem-cancel':{const r=S.reminders.find(x=>x.id===ds.id);r.status='cancelled';logA('x','Cancelled a reminder for '+cl(r.client).name);toast('Reminder cancelled');touch();break}
  case 'rem-approve':{const r=S.reminders.find(x=>x.id===ds.id);r.approve=false;toast('Approved. It will send on '+fDT(r.at));touch();break}
  case 'modal-close':closeModal();break;
  case 'modal-save':{const cid=$('#sm-c').value,at=new Date($('#sm-a').value);if(isNaN(at)){toast('Choose a date and time');break}
    addReminder({client:cid,tpl:$('#sm-t').value,at:at,repeat:$('#sm-r').value,text:$('#sm-x').value});closeModal();toast('Reminder scheduled for '+fDT(at));if(S.page==='whatsapp'){S.ui.wa.client=cid;render(true)}else touch();break}
  /* files */
  case 'fs-toggle':{const o=S.ui.fs.open;o.has(ds.k)?o.delete(ds.k):o.add(ds.k);$('#fs-tree').innerHTML=treeHTML();break}
  case 'fs-file':S.ui.fs.sel=ds.id;$('#fs-tree').innerHTML=treeHTML();$('#fs-detail').innerHTML=fileDetail();break;
  case 'fs-collapse':S.ui.fs.open.clear();$('#fs-tree').innerHTML=treeHTML();break;
  case 'fs-expand':{const o=S.ui.fs.open;S.files.forEach(f=>{o.add('c:'+f.client);o.add('y:'+f.client+':'+f.year);o.add('m:'+f.client+':'+f.year+':'+f.mo)});$('#fs-tree').innerHTML=treeHTML();break}
  case 'fs-copy':{const f=S.files.find(x=>x.id===ds.id);try{navigator.clipboard.writeText(winPath(f))}catch(err){}toast('Path copied');break}
  case 'fs-ex':S.ui.ex.sel=ds.id;S.ui.ex.filter='all';go('extract',0);break;
  case 'fs-client':{const u=S.ui.fs;u.q='';u.open.add('c:'+ds.c);u.open.add('y:'+ds.c+':2026');u.open.add('m:'+ds.c+':2026:8');u.open.add('b:'+ds.c+':2026:8:Raw');go('files',0);break}
  /* deadlines */
  case 'dl-toggle':{const o=S.ui.dl.open;o.has(ds.c)?o.delete(ds.c):o.add(ds.c);render(true);break}
  case 'dl-cat':S.ui.dl.cat=ds.v;render(true);break;
  case 'dl-stat':S.ui.dl.stat=ds.v;render(true);break;
  case 'step':{const t=S.tasks.find(x=>x.id===ds.t),i=+ds.i;t.steps[i]=!t.steps[i];if(t.steps.every(Boolean)){toast(t.name+' is complete');logA('check','Completed '+t.name+' for '+cl(t.client).name)}touch();break}
  case 'dl-remind':{const at=vnow();at.setDate(at.getDate()+1);at.setHours(10,0,0,0);addReminder({client:ds.c,tpl:missing(cl(ds.c)).length?'pending':'docs',at:at});toast('Reminder scheduled for '+fDT(at));touch();break}
  case 'dl-remind-all':{const at=vnow();at.setDate(at.getDate()+1);at.setHours(10,0,0,0);const list=S.clients.filter(c=>missing(c).length);list.forEach(c=>addReminder({client:c.id,tpl:'pending',at:at}));toast(list.length+' reminders scheduled for '+fDT(at));touch();break}
  /* generator */
  case 'gen-type':{const s=S.ui.gen.types;s.has(ds.id)?s.delete(ds.id):s.add(ds.id);render(true);break}
  case 'gen-rec':S.ui.gen.types=new Set(recommended(cl(S.ui.gen.client)));render(true);break;
  case 'gen-run':startGen();break;
  case 'gen-prev':{const u=S.ui.gen;u.prev=u.prev===+ds.i?null:+ds.i;$('#gen-out').innerHTML=outHTML();break}
  case 'gen-copy':{const o=S.ui.gen.out[+ds.i];try{navigator.clipboard.writeText(o.content)}catch(err){}toast('Copied to clipboard');break}
  case 'gen-save':{const u=S.ui.gen,o=u.out[+ds.i],t=GEN.find(g=>g.id===o.type),c=cl(u.client),p=u.per.split('-').map(Number);if(o.saved){toast('Already saved');break}
    addFile({client:c.id,year:p[0],mo:p[1]-1,bucket:'Generated',name:outName(t,c,u.per),size:Math.max(2,Math.round(o.content.length/900)),at:vnow(),src:'File generator'});o.saved=true;logA('folder','Saved '+outName(t,c,u.per)+' to '+c.name+' / Generated');toast('Saved to '+c.short+' / Generated');$('#gen-out').innerHTML=outHTML();renderSide();break}
  case 'gen-client-go':S.ui.gen.client=ds.c;S.ui.gen.types=new Set(recommended(cl(ds.c)));S.ui.gen.out=[];go('generate',0);break;
  /* billing */
  case 'bl-remind':{const b=S.bills.find(x=>x.no===ds.no),at=new Date(vnow().getTime()+300000);addReminder({client:b.client,tpl:'fee',at:at});toast('Payment reminder scheduled for '+cl(b.client).short);touch();break}
  case 'bl-remind-all':{const list=S.bills.filter(b=>b.status==='overdue'),at=new Date(vnow().getTime()+300000);list.forEach(b=>addReminder({client:b.client,tpl:'fee',at:at}));toast(list.length+' payment reminders scheduled');touch();break}
  case 'bl-paid':{const b=S.bills.find(x=>x.no===ds.no);b.status='paid';logA('rupee','Marked '+b.no+' as paid for '+cl(b.client).name);toast(b.no+' marked as paid');touch();break}
  /* settings */
  case 'st-tab':S.ui.st.tab=ds.t;render(true);break;
  case 'toggle':S.settings[ds.k]=!S.settings[ds.k];render(true);toast((S.settings[ds.k]?'Turned on':'Turned off'));break;
  case 'st-toast':toast(ds.m);break;
  }
});
document.addEventListener('change',e=>{
  const b=e.target.dataset&&e.target.dataset.bind;if(!b)return;
  if((b==='gen-client'||b==='gen-per')&&S.ui.gen.running){render(true);toast('Wait for the current files to finish');return}
  if(b==='gen-client'){S.ui.gen.client=e.target.value;S.ui.gen.types=new Set(recommended(cl(e.target.value)));S.ui.gen.out=[];S.ui.gen.prev=null;render(true)}
  else if(b==='gen-per'){S.ui.gen.per=e.target.value;S.ui.gen.out=[];render(true)}
  else if(b==='sm-fill')fillSm();
  else if(b==='docf'){const d=S.docs.find(x=>x.id===e.target.dataset.id),f=e.target.dataset.f,v=e.target.value.trim();
    if(f==='date'){const p=v.split('-').map(Number);if(p.length===3&&!p.some(isNaN))d.date=new Date(p[0],p[1]-1,p[2])}
    else if(f==='taxable'||f==='rate'){const n=parseFloat(v.replace(/,/g,''));if(!isNaN(n))d[f]=n}else d[f]=v;
    d.conf[f]=1;if(d.status==='approved')d.status='extracted';logA('scan','Corrected '+f+' on '+d.no);render(true)}
  else if(b==='wa-tpl-x'){}
  if(e.target.id==='wa-tpl'&&e.target.value){const c=cl(S.ui.wa.client),t=TPL.find(x=>x.id===e.target.value);$('#wa-in').value=fillTpl(t,c);e.target.value='';$('#wa-in').focus()}
});
document.addEventListener('input',e=>{
  const b=e.target.dataset&&e.target.dataset.bind;
  if(b==='fsq'){S.ui.fs.q=e.target.value;$('#fs-tree').innerHTML=treeHTML()}
  if(e.target.id==='gs')globalSearch(e.target.value)});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='wa-in'){e.preventDefault();sendMsg()}
  if(e.key==='Enter'&&e.target.id==='ai-in'){e.preventDefault();ask(e.target.value);e.target.value=''}
  if(e.key==='Escape'){closeModal();$('#gres').hidden=true}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#gs').focus()}});
document.addEventListener('mouseover',e=>{const r=e.target.closest('[data-hlf]');if(!r)return;$$('.paper mark').forEach(m=>m.classList.toggle('on',m.dataset.hl===r.dataset.hlf))});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-hlf]'))$$('.paper mark.on').forEach(m=>m.classList.remove('on'))});
document.addEventListener('focusin',e=>{const r=e.target.closest&&e.target.closest('[data-hlf]');if(r)$$('.paper mark').forEach(m=>m.classList.toggle('on',m.dataset.hl===r.dataset.hlf))});

function sendMsg(){const i=$('#wa-in');if(!i)return;const v=i.value.trim();if(!v)return;const cid=S.ui.wa.client,m={id:MID++,f:'me',t:v,at:vnow(),st:'sent'};
  S.threads[cid].push(m);i.value='';refreshWA();$('#wa-in').focus();
  setTimeout(()=>{m.st='read';if(S.page==='whatsapp'&&S.ui.wa.client===cid&&S.ui.wa.tab==='chats')refreshWA()},900);
  setTimeout(()=>{const wantsDoc=/bank|invoice|bill|document|send|share|statement|receipt/i.test(v);
    S.threads[cid].push({id:MID++,f:'cl',t:wantsDoc?'Sending the files now.':SAMPLE_REPLIES[Math.floor(Math.random()*SAMPLE_REPLIES.length)],at:vnow(),st:'read'});
    if(S.page==='whatsapp'&&S.ui.wa.tab==='chats')refreshWA();else renderSide();
    if(wantsDoc)setTimeout(()=>inbound(cid),1600)},2200)}
function globalSearch(q){const g=$('#gres');q=q.trim().toLowerCase();if(!q){g.hidden=true;return}
  const r=[];S.clients.forEach(c=>{if(c.name.toLowerCase().indexOf(q)>=0||c.gstin.toLowerCase().indexOf(q)>=0)r.push({ic:'users',t:c.name,s:'Client · '+c.city,act:'wa-open',c:c.id})});
  S.docs.forEach(d=>{if((d.party+' '+d.no).toLowerCase().indexOf(q)>=0)r.push({ic:'scan',t:d.party+' · '+d.no,s:'Invoice · '+cl(d.client).name,act:'ex-goto',id:d.id})});
  S.files.filter(f=>f.name.toLowerCase().indexOf(q)>=0).slice(0,4).forEach(f=>r.push({ic:'file',t:f.name,s:'File · '+cl(f.client).name+' / '+f.bucket,act:'fs-goto',id:f.id}));
  g.innerHTML=r.length?r.slice(0,8).map((x,i)=>'<button data-gi="'+i+'">'+ic(x.ic,16)+'<span><b>'+esc(x.t)+'</b><small>'+esc(x.s)+'</small></span></button>').join(''):'<div class="empty" style="padding:14px"><b>No matches</b></div>';
  g.hidden=false;g._r=r.slice(0,8)}
$('#gres').addEventListener('click',e=>{const b=e.target.closest('[data-gi]');if(!b)return;const x=$('#gres')._r[+b.dataset.gi];$('#gres').hidden=true;$('#gs').value='';
  if(x.act==='wa-open'){S.ui.wa={client:x.c,tab:'chats'};go('whatsapp',0)}
  else if(x.act==='ex-goto'){S.ui.ex.sel=x.id;S.ui.ex.filter='all';go('extract',0)}
  else{const f=S.files.find(y=>y.id===x.id),u=S.ui.fs;u.q='';u.open.add('c:'+f.client);u.open.add('y:'+f.client+':'+f.year);u.open.add('m:'+f.client+':'+f.year+':'+f.mo);u.open.add('b:'+f.client+':'+f.year+':'+f.mo+':'+f.bucket);u.sel=f.id;go('files',0)}});

/* timed reminders: anything set to auto-send goes out when due */
setInterval(()=>{let ch=false;S.reminders.forEach(r=>{if(r.status==='scheduled'&&!r.approve&&r.at<=vnow()){sendReminderNow(r);toast('Reminder sent to '+cl(r.client).short);ch=true}});if(ch)touch()},15000);

/* ================= boot ================= */
seed();
$('#gsi').innerHTML=ic('search',14);$('#thbtn').innerHTML=ic('sun',16);$('#chbtn').innerHTML=ic('panel',16);$('#ailogo').innerHTML=ic('spark',16);$('#aisend').innerHTML=ic('send',16);
$('#sugg').innerHTML=SUGG.map(s=>'<button data-act="ai-chip" data-q="'+esc(s)+'">'+esc(s)+'</button>').join('');
addMsg('ai','Hello. I can check any part of your practice and open the page that shows it. Ask about deadlines, missing documents, invoices, folders, fees, or ask me to schedule reminders and generate files.');
render(false);
})();
</script>
</body>
</html>
